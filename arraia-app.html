<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a2540" />
<title>Arraiá App — Festa Junina</title>
<meta name="description" content="Tudo sobre o arraiá: agenda, receitas, jogos, barraquinhas e correio elegante." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700&display=swap" />
<style>
  :root{
    --bg:#141d33; --bg2:#1c2746; --card:#22305a; --border:#3a4878;
    --primary:#f0843a; --primary-2:#e2562c; --fg:#fdf6ec; --muted:#a4adc8;
    --flag1:#f0843a; --flag2:#e2562c; --flag3:#5aa3e8; --flag4:#f4c948;
    --shadow:0 8px 24px -8px rgba(240,132,58,.45);
    --radius:1rem;
  }
  *{box-sizing:border-box;border-color:var(--border)}
  html,body{margin:0;padding:0}
  body{
    font-family:"Inter",system-ui,sans-serif;
    background:linear-gradient(180deg,#1c2746,#101729);
    color:var(--fg); min-height:100dvh;
  }
  h1,h2,.font-festive{font-family:"Bungee",system-ui,sans-serif;letter-spacing:.02em;margin:0}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:inherit;text-decoration:none}
  ul{list-style:none;margin:0;padding:0}

  .app{max-width:28rem;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative}
  header{position:sticky;top:0;z-index:20;background:rgba(20,29,51,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .topbar{position:relative;display:flex;align-items:center;justify-content:center;padding:.75rem 1rem}
  .topbar h1{font-size:1.5rem;color:var(--primary);text-transform:uppercase}
  .back{position:absolute;left:.75rem;width:2rem;height:2rem;border-radius:9999px;background:var(--primary);color:#1a2540;display:grid;place-items:center;font-weight:700}
  main{flex:1;padding:1rem 1rem 1.5rem}

  /* Bandeirinhas */
  .bunting{display:flex;justify-content:space-around;padding:0 .5rem;height:28px;overflow:hidden}
  .bunting span{width:18px;height:24px;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;animation:sway 3s ease-in-out infinite}
  .bunting span:nth-child(4n+1){background:var(--flag1)}
  .bunting span:nth-child(4n+2){background:var(--flag2)}
  .bunting span:nth-child(4n+3){background:var(--flag3)}
  .bunting span:nth-child(4n+4){background:var(--flag4)}
  .bunting span:nth-child(odd){animation-delay:-1.5s}
  @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  @keyframes flicker{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}
  .flicker{animation:flicker 1.6s ease-in-out infinite}

  /* Card / botão */
  .card{background:var(--card);border:2px solid var(--primary);border-radius:1.5rem;box-shadow:0 4px 16px -4px rgba(0,0,0,.4)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
    background:linear-gradient(135deg,#f4a45a,#e2562c);color:#1a2540;
    font-weight:700;padding:.75rem 1.5rem;border-radius:9999px;box-shadow:var(--shadow);
    transition:transform .15s ease;text-transform:uppercase;font-size:.9rem;width:100%;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0)}

  /* Welcome */
  .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem;gap:1.5rem}
  .welcome h1{font-size:3rem;line-height:1.05;color:var(--primary);text-shadow:0 4px 0 #1a2540}
  .fire{font-size:7rem;line-height:1;filter:drop-shadow(0 0 30px rgba(240,132,58,.6))}
  .welcome p{font-size:1.05rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin:0}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
  .grid-item{padding:1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;aspect-ratio:1;transition:transform .2s}
  .grid-item:hover{transform:translateY(-4px)}
  .grid-item .icon{font-size:2.5rem}
  .grid-item .label{font-family:"Bungee";text-transform:uppercase;font-size:.85rem;color:var(--primary);text-align:center;line-height:1.1}

  /* Agenda */
  .show-thumb{aspect-ratio:1;background:linear-gradient(135deg,rgba(240,132,58,.3),rgba(226,86,44,.3));display:grid;place-items:center;font-size:3.5rem;border-radius:1.4rem 1.4rem 0 0}
  .show-info{padding:.75rem;text-align:center}
  .show-info h3{font-size:.85rem;margin:0 0 .25rem;font-weight:700}
  .show-info .when{font-family:"Bungee";color:var(--primary);font-size:.75rem}

  /* Tabs barraquinhas */
  .tabs{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:.75rem}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;padding:.5rem 1rem;border-radius:9999px;background:var(--card);font-weight:700;font-size:.85rem;border:1px solid var(--border)}
  .tab.active{background:var(--primary);color:#1a2540;border-color:var(--primary)}
  .row{padding:1rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
  .row .price{font-family:"Bungee";color:var(--primary)}

  /* Jogos */
  .jogo{padding:1rem;display:flex;align-items:center;gap:1rem;margin-bottom:.75rem}
  .jogo .emo{font-size:2.5rem}
  .jogo h3{font-family:"Bungee";color:var(--primary);text-transform:uppercase;font-size:1rem;margin:0 0 .25rem}
  .jogo p{font-size:.75rem;color:var(--muted);margin:0}

  /* Forms */
  label.field{display:block;margin-bottom:.9rem}
  label.field span{font-size:.85rem;font-weight:700;color:var(--primary)}
  .field input, .field textarea{
    margin-top:.25rem;width:100%;border-radius:9999px;background:var(--primary);
    color:#1a2540;font-weight:600;padding:.6rem 1rem;border:none;outline:none;
    font-family:inherit;font-size:.95rem;
  }
  .field input::placeholder, .field textarea::placeholder{color:rgba(26,37,64,.55)}
  .field textarea{border-radius:1rem;resize:none;min-height:100px}
  .chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.9rem}
  .chip{font-size:.7rem;padding:.35rem .7rem;border-radius:9999px;background:var(--card);border:1px solid var(--border)}
  .chip:hover{border-color:var(--primary)}

  /* Bilhetes */
  .bilhete{padding:1rem;display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;text-align:left;width:100%}
  .avatar{width:2.5rem;height:2.5rem;border-radius:9999px;background:var(--primary);color:#1a2540;display:grid;place-items:center;font-family:"Bungee";flex-shrink:0}
  .bilhete .info{min-width:0;flex:1}
  .bilhete .info p{margin:0}
  .bilhete .info .from{font-weight:700;font-size:.85rem}
  .bilhete .info .preview{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Modal */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:1rem}
  .modal.open{display:flex}
  .modal .card{padding:1.5rem;max-width:24rem;width:100%;max-height:80vh;overflow:auto}
  .modal h2{font-size:1.5rem;color:var(--primary);text-align:center;margin:.5rem 0 1rem;text-transform:uppercase}
  .msg-bubble{background:var(--primary);color:#1a2540;border-radius:1rem;padding:1rem;font-weight:700;text-align:center;margin:.75rem 0;font-size:1.05rem}

  /* Bottom nav */
  nav.bottom{position:sticky;bottom:0;background:var(--primary);box-shadow:0 -6px 20px -8px rgba(0,0,0,.5);z-index:30}
  nav.bottom ul{display:flex;justify-content:space-around;padding:.4rem .5rem;max-width:28rem;margin:0 auto}
  nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.4rem .8rem;border-radius:.75rem;color:#1a2540;opacity:.92;transition:transform .15s, background .15s}
  nav.bottom a.active{background:rgba(26,37,64,.15);transform:scale(1.05);opacity:1}
  nav.bottom svg{width:1.25rem;height:1.25rem;stroke-width:2.5}
  nav.bottom .lbl{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}

  .empty{text-align:center;padding:3rem 0;color:var(--muted)}
  .empty .big{font-size:3rem;opacity:.4}
  .center-stack{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1rem;padding:3rem 0}

  .hidden{display:none !important}
  .text-muted{color:var(--muted)}
  .text-center{text-align:center}
  .text-sm{font-size:.85rem}
  .mt-2{margin-top:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}
  .stack > * + *{margin-top:.75rem}
  .profile-avatar{width:6rem;height:6rem;border-radius:9999px;background:var(--primary);color:#1a2540;display:grid;place-items:center;margin:0 auto 1rem;font-size:3rem;font-family:"Bungee"}

  @media(min-width:480px){
    .welcome h1{font-size:3.5rem}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<!-- Modais -->
<div class="modal" id="modal">
  <div class="card" id="modalContent"></div>
</div>

<script>
/* ===== ESTADO ===== */
const LS_BIL = "arraia_bilhetes";
const LS_PROF = "arraia_perfil";
const getBilhetes = () => { try { return JSON.parse(localStorage.getItem(LS_BIL)||"[]") } catch { return [] } };
const saveBilhetes = (a) => localStorage.setItem(LS_BIL, JSON.stringify(a));
const addBilhete = (b) => { const novo={...b,id:crypto.randomUUID(),data:new Date().toISOString()}; saveBilhetes([novo,...getBilhetes()]); return novo; };
const getPerfil = () => { try { return JSON.parse(localStorage.getItem(LS_PROF)||'{"nome":"","email":""}') } catch { return {nome:"",email:""} } };
const setPerfil = (p) => localStorage.setItem(LS_PROF, JSON.stringify(p));

/* ===== ROTAS ===== */
const routes = {
  "/":           { render: renderWelcome,    nav:false },
  "/home":       { render: renderHome,       title:"Atrações",          showBack:false },
  "/agenda":     { render: renderAgenda,     title:"Agenda de Festas" },
  "/receitas":   { render: renderReceitas,   title:"Receitas Típicas" },
  "/jogos":      { render: renderJogos,      title:"Jogos Juninos" },
  "/barraquinhas":{render: renderBarraquinhas,title:"Barraquinhas" },
  "/correio":    { render: renderCorreio,    title:"Correio Elegante" },
  "/correio/enviar":   { render: renderEnviar,   title:"Enviar Bilhete" },
  "/correio/bilhetes": { render: renderBilhetes, title:"Bilhetes" },
  "/localizacao":{ render: renderLocal,      title:"Localização" },
  "/perfil":     { render: renderPerfil,     title:"Perfil" },
  "/menu":       { render: renderMenu,       title:"Menu" },
};
function go(path){ location.hash = path; }
function currentPath(){ return location.hash.replace(/^#/,"") || "/"; }
function getQuery(){ const i=currentPath().indexOf("?"); if(i<0) return {}; return Object.fromEntries(new URLSearchParams(currentPath().slice(i+1))); }
function getCleanPath(){ const p=currentPath(); const i=p.indexOf("?"); return i<0?p:p.slice(0,i); }

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

/* ===== ICONES (SVG inline) ===== */
const ic = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 004 0"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M3 12h18M3 18h18"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s7-7 7-12a7 7 0 10-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="3"/></svg>',
};

/* ===== SHELL ===== */
function shell({title, showBack=true, showNav=true, body}){
  const path = getCleanPath();
  const navItems = [
    {to:"/home",icon:ic.home,label:"Início"},
    {to:"/agenda",icon:ic.bell,label:"Agenda"},
    {to:"/menu",icon:ic.menu,label:"Menu"},
    {to:"/localizacao",icon:ic.pin,label:"Local"},
    {to:"/perfil",icon:ic.user,label:"Perfil"},
  ];
  return `
    <header>
      <div class="bunting">${'<span></span>'.repeat(18)}</div>
      ${title ? `
        <div class="topbar">
          ${showBack?`<button class="back" onclick="history.back()" aria-label="Voltar">←</button>`:""}
          <h1>${title}</h1>
        </div>
      `:""}
    </header>
    <main>${body}</main>
    ${showNav?`
      <nav class="bottom">
        <ul>
          ${navItems.map(n=>`
            <li><a href="#${n.to}" class="${path===n.to?"active":""}">
              ${n.icon}<span class="lbl">${n.label}</span>
            </a></li>
          `).join("")}
        </ul>
      </nav>
    `:""}
  `;
}

/* ===== TELAS ===== */
function renderWelcome(){
  return `
    <div class="bunting">${'<span></span>'.repeat(18)}</div>
    <div class="welcome">
      <h1>Bem Vindo<br>Arraiá<br><span style="color:#e2562c">App</span></h1>
      <div class="fire flicker">🔥</div>
      <p>Preparado pro forró,<br>paquera e diversão?</p>
      <a href="#/home" class="btn" style="max-width:14rem">Entrar no Arraiá</a>
    </div>
    <div class="bunting">${'<span></span>'.repeat(18)}</div>
  `;
}

function renderHome(){
  const items = [
    {to:"/barraquinhas",e:"⛺",l:"Barraquinhas"},
    {to:"/jogos",e:"🎯",l:"Jogos Juninos"},
    {to:"/receitas",e:"🍳",l:"Receitas Típicas"},
    {to:"/agenda",e:"📅",l:"Agenda de Festas"},
    {to:"/correio",e:"💌",l:"Correio Elegante"},
    {to:"/localizacao",e:"📍",l:"Localização"},
  ];
  return `<div class="grid">
    ${items.map(i=>`<a href="#${i.to}" class="card grid-item">
      <div class="icon">${i.e}</div><div class="label">${i.l}</div>
    </a>`).join("")}
  </div>`;
}

function renderAgenda(){
  const shows = [
    {n:"Jorge & Mateus",d:"13/07",h:"20:00",e:"🎤"},
    {n:"Vorgh",d:"19/07",h:"20:00",e:"🎸"},
    {n:"Luan Santana",d:"02/08",h:"20:00",e:"🤠"},
    {n:"Kay Black",d:"20/07",h:"20:00",e:"🎶"},
    {n:"Henrique & Juliano",d:"27/07",h:"21:00",e:"🎻"},
    {n:"Marília Trio",d:"03/08",h:"22:00",e:"🪗"},
  ];
  return `<div class="grid">${shows.map(s=>`
    <article class="card" style="overflow:hidden">
      <div class="show-thumb">${s.e}</div>
      <div class="show-info"><h3>${s.n}</h3><div class="when">${s.d} · ${s.h}h</div></div>
    </article>`).join("")}</div>`;
}

const RECEITAS = [
  { nome:"Maçã do Amor", emoji:"🍎", ing:["6 maçãs","2 xíc. açúcar","1 xíc. água","Corante vermelho"], modo:"Lave as maçãs, espete os palitos. Leve açúcar, água e corante ao fogo até caramelo. Mergulhe e deixe secar." },
  { nome:"Pamonha", emoji:"🌽", ing:["10 espigas","1 xíc. leite","Açúcar a gosto","Palha de milho"], modo:"Bata o milho com leite, adoce. Embrulhe na palha e cozinhe por 40 min." },
  { nome:"Canjica", emoji:"🥥", ing:["500g milho branco","1 lata leite condensado","200ml leite de coco","Canela"], modo:"Cozinhe o milho. Junte os leites e canela. Mexa até engrossar." },
  { nome:"Cachorro Quente", emoji:"🌭", ing:["Pão","Salsicha","Molho","Batata palha"], modo:"Aqueça as salsichas no molho. Monte com batata palha." },
  { nome:"Bolo de Fubá", emoji:"🍰", ing:["2 xíc. fubá","1 xíc. leite","3 ovos","1 xíc. açúcar"], modo:"Misture tudo, asse a 180°C por 40 min." },
  { nome:"Arroz Doce", emoji:"🍚", ing:["1 xíc. arroz","1L leite","1 lata leite condensado","Canela"], modo:"Cozinhe o arroz no leite. Adicione leite condensado e canela." },
];
function renderReceitas(){
  return `<div class="grid">${RECEITAS.map((r,i)=>`
    <button class="card grid-item" onclick="openReceita(${i})" style="cursor:pointer">
      <div class="icon" style="font-size:3rem">${r.emoji}</div>
      <div class="label" style="color:var(--fg);font-family:Inter;font-weight:700;font-size:.8rem">${r.nome}</div>
    </button>`).join("")}</div>`;
}
window.openReceita = (i) => {
  const r = RECEITAS[i];
  document.getElementById("modalContent").innerHTML = `
    <div style="font-size:3rem;text-align:center">${r.emoji}</div>
    <h2>${r.nome}</h2>
    <h3 style="color:var(--primary);margin:.5rem 0">Ingredientes</h3>
    <ul style="padding-left:1.2rem;font-size:.9rem">${r.ing.map(x=>`<li>${x}</li>`).join("")}</ul>
    <h3 style="color:var(--primary);margin:.75rem 0 .25rem">Modo de preparo</h3>
    <p style="font-size:.9rem">${r.modo}</p>
    <button class="btn" style="margin-top:1rem" onclick="closeModal()">Fechar</button>
  `;
  document.getElementById("modal").classList.add("open");
};
window.closeModal = () => document.getElementById("modal").classList.remove("open");
document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });

function renderJogos(){
  const jogos = [
    {n:"Pescaria",e:"🎣",d:"Pesque os peixinhos numerados e ganhe prêmios incríveis!"},
    {n:"Boca do Palhaço",e:"🤡",d:"Acerte a bolinha na boca do palhaço de diferentes distâncias."},
    {n:"Jogo das Argolas",e:"🎯",d:"Acerte as argolas nas garrafas para ganhar."},
    {n:"Tomba Latas",e:"🥫",d:"Derrube todas as latas com 3 arremessos."},
    {n:"Corrida do Saco",e:"🦘",d:"Pule até a linha de chegada e prove sua agilidade."},
    {n:"Pau de Sebo",e:"🪵",d:"Suba o pau ensebado e pegue o prêmio no topo."},
  ];
  return `<ul>${jogos.map(j=>`
    <li class="card jogo"><div class="emo">${j.e}</div>
    <div><h3>${j.n}</h3><p>${j.d}</p></div></li>
  `).join("")}</ul>`;
}

const CATS = [
  {n:"Doces",e:"🍬",itens:[{n:"Maçã do Amor",p:"R$ 5,00"},{n:"Pé de Moleque",p:"R$ 3,00"},{n:"Cocada",p:"R$ 4,00"}]},
  {n:"Milho",e:"🌽",itens:[{n:"Milho Cozido",p:"R$ 6,00"},{n:"Pamonha",p:"R$ 8,00"},{n:"Curau",p:"R$ 5,00"}]},
  {n:"Salgados",e:"🥟",itens:[{n:"Pastel",p:"R$ 7,00"},{n:"Cachorro Quente",p:"R$ 10,00"},{n:"Espetinho",p:"R$ 12,00"}]},
  {n:"Bebidas",e:"🥤",itens:[{n:"Quentão",p:"R$ 6,00"},{n:"Vinho Quente",p:"R$ 8,00"},{n:"Refrigerante",p:"R$ 5,00"}]},
];
let _tab = 0;
function renderBarraquinhas(){
  return `
    <div class="tabs">${CATS.map((c,i)=>`
      <button class="tab ${i===_tab?'active':''}" onclick="setTab(${i})">${c.e} ${c.n}</button>
    `).join("")}</div>
    <div>${CATS[_tab].itens.map(it=>`
      <div class="card row"><span style="font-weight:700">${it.n}</span><span class="price">${it.p}</span></div>
    `).join("")}</div>
  `;
}
window.setTab = (i)=>{ _tab=i; render(); };

function renderCorreio(){
  const items = [
    {to:"/correio/enviar?anonimo=1",e:"💌",t:"Enviar Anônimo",d:"Sem revelar quem enviou"},
    {to:"/correio/enviar?anonimo=0",e:"✉️",t:"Com Nome",d:"Revele quem é o admirador"},
    {to:"/correio/bilhetes",e:"📥",t:"Bilhetes Recebidos",d:"Veja suas mensagens"},
  ];
  return `
    <p class="text-center text-sm text-muted mb-4">Mande uma mensagem fofa pra alguém especial 💌</p>
    <div class="stack">
      ${items.map(i=>`<a href="#${i.to}" class="card jogo" style="text-decoration:none">
        <div class="emo">${i.e}</div>
        <div><h3>${i.t}</h3><p>${i.d}</p></div>
      </a>`).join("")}
    </div>
  `;
}

const SUGESTOES = [
  "Ce não é São João, mas fez meu coração pulá!",
  "Você é tão linda quanto as noites de São João!",
  "Se beleza desse cadeia, você pegava prisão perpétua!",
  "Meu coração tá igual fogueira: aceso por você.",
];
function renderEnviar(){
  const anon = getQuery().anonimo !== "0";
  return `
    <form id="bilheteForm" onsubmit="enviarBilhete(event, ${anon})">
      ${!anon?`<label class="field"><span>De:</span>
        <input name="de" required placeholder="Seu nome" /></label>`:""}
      <label class="field"><span>Mensagem:</span>
        <textarea name="msg" required>${SUGESTOES[0]}</textarea></label>
      <div class="chips">
        ${SUGESTOES.map(s=>`<button type="button" class="chip" onclick="document.querySelector('[name=msg]').value=this.dataset.s" data-s="${s.replace(/"/g,'&quot;')}">${s.slice(0,28)}…</button>`).join("")}
      </div>
      <label class="field"><span>Para:</span>
        <input name="para" required placeholder="Nome de quem vai receber" /></label>
      <button class="btn" type="submit">Enviar Bilhete 💌</button>
    </form>
  `;
}
window.enviarBilhete = (ev, anon) => {
  ev.preventDefault();
  const f = ev.target;
  addBilhete({
    para: f.para.value.trim(),
    de: anon ? "Anônimo" : f.de.value.trim(),
    mensagem: f.msg.value.trim(),
    anonimo: anon,
  });
  document.querySelector("main").innerHTML = `
    <div class="center-stack">
      <div class="fire flicker">💌</div>
      <h2 style="color:var(--primary);font-size:1.75rem">Bilhete Enviado!</h2>
      <p class="text-muted text-sm">Levando até quem você ama</p>
    </div>
  `;
  setTimeout(()=>go("/correio/bilhetes"), 1400);
};

function renderBilhetes(){
  const list = getBilhetes();
  if(!list.length) return `
    <div class="empty"><div class="big">💌</div>
    <p>Nenhum bilhete ainda.</p>
    <p style="font-size:.75rem;margin-top:.25rem">Envie um para começar a coleção</p></div>
  `;
  return `<ul>${list.map((b,i)=>`
    <li><button class="card bilhete" onclick="abrirBilhete(${i})">
      <div class="avatar">${(b.de[0]||"?").toUpperCase()}</div>
      <div class="info">
        <p class="from">De: ${b.de}</p>
        <p class="preview">${b.mensagem}</p>
      </div>
    </button></li>
  `).join("")}</ul>`;
}
window.abrirBilhete = (i) => {
  const b = getBilhetes()[i];
  document.getElementById("modalContent").innerHTML = `
    <p style="color:var(--primary);font-weight:700;font-size:.85rem;text-align:center">De: ${b.de}</p>
    <div class="msg-bubble">${b.mensagem}</div>
    <p style="color:var(--primary);font-weight:700;font-size:.85rem;text-align:center">Para: ${b.para}</p>
    <button class="btn" style="margin-top:1rem" onclick="closeModal()">Fechar</button>
  `;
  document.getElementById("modal").classList.add("open");
};

function renderLocal(){
  const end = "Prefeitura de Sorocaba - Paço Municipal, Sorocaba/SP";
  const url = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(end);
  return `<div class="card" style="overflow:hidden">
    <div style="aspect-ratio:16/9;background:linear-gradient(135deg,rgba(240,132,58,.4),rgba(226,86,44,.4));display:grid;place-items:center;font-size:5rem">🎪</div>
    <div style="padding:1.25rem">
      <div style="display:flex;gap:.75rem;margin-bottom:.75rem"><span style="font-size:1.2rem">📅</span>
        <div><div class="text-sm text-muted">Data</div><div style="font-weight:700">03 de Julho a 03 de Agosto</div></div></div>
      <div style="display:flex;gap:.75rem;margin-bottom:.75rem"><span style="font-size:1.2rem">⏰</span>
        <div><div class="text-sm text-muted">Horário</div><div style="font-weight:700">18h às 00h</div></div></div>
      <div style="display:flex;gap:.75rem;margin-bottom:.75rem"><span style="font-size:1.2rem">📍</span>
        <div><div class="text-sm text-muted">Endereço</div><div style="font-weight:700">${end}</div></div></div>
      <a href="${url}" target="_blank" rel="noreferrer" class="btn" style="margin-top:.5rem">Abrir no Google Maps</a>
    </div>
  </div>`;
}

function renderPerfil(){
  const p = getPerfil();
  const count = getBilhetes().length;
  return `
    <div class="text-center mb-4">
      <div class="profile-avatar">${(p.nome[0]||"?").toUpperCase()}</div>
      <div style="font-family:Bungee;font-size:1.25rem;color:var(--primary)">${p.nome||"Seu Nome"}</div>
      <div class="text-sm text-muted">${p.email||"seu@email.com"}</div>
      <div class="text-sm" style="color:var(--primary);font-weight:700;margin-top:.4rem">💌 ${count} bilhete(s) recebido(s)</div>
    </div>
    <form onsubmit="salvarPerfil(event)">
      <label class="field"><span>Nome:</span>
        <input name="nome" value="${p.nome}" placeholder="Seu nome completo" /></label>
      <label class="field"><span>E-mail:</span>
        <input name="email" type="email" value="${p.email}" placeholder="email@exemplo.com" /></label>
      <button class="btn" type="submit" id="btnSalvar">Salvar Perfil</button>
    </form>
  `;
}
window.salvarPerfil = (ev) => {
  ev.preventDefault();
  const f = ev.target;
  setPerfil({nome:f.nome.value.trim(), email:f.email.value.trim()});
  const btn = document.getElementById("btnSalvar");
  btn.textContent = "Salvo! ✓";
  setTimeout(()=>render(), 900);
};

function renderMenu(){
  const items = [
    {to:"/home",e:"🏠",l:"Início"},
    {to:"/agenda",e:"📅",l:"Agenda de Festas"},
    {to:"/receitas",e:"🍳",l:"Receitas Típicas"},
    {to:"/jogos",e:"🎯",l:"Jogos Juninos"},
    {to:"/barraquinhas",e:"⛺",l:"Barraquinhas"},
    {to:"/correio",e:"💌",l:"Correio Elegante"},
    {to:"/localizacao",e:"📍",l:"Localização"},
    {to:"/perfil",e:"👤",l:"Perfil"},
  ];
  return `<ul class="stack">${items.map(i=>`
    <li><a href="#${i.to}" class="card jogo" style="text-decoration:none">
      <div class="emo">${i.e}</div>
      <div><h3 style="color:var(--fg);font-family:Inter;font-size:1rem;margin:0">${i.l}</h3></div>
    </a></li>
  `).join("")}</ul>`;
}

/* ===== RENDER PRINCIPAL ===== */
function render(){
  const path = getCleanPath();
  const route = routes[path] || routes["/"];
  const body = route.render();
  if(route === routes["/"]){
    document.getElementById("app").innerHTML = body;
  } else {
    document.getElementById("app").innerHTML = shell({
      title: route.title,
      showBack: route.showBack !== false,
      showNav: route.nav !== false,
      body,
    });
  }
  window.scrollTo(0,0);
}
</script>
</body>
</html>
